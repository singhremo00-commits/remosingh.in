<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Video Releases | Remo Singh</title>
  <style>
    body {
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 30px 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .btn-back {
      display: inline-block;
      margin-bottom: 24px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .btn-back:hover {
      color: #fff;
    }
    .header {
      text-align: center;
      margin-bottom: 35px;
    }
    .header .badge {
      display: inline-block;
      background: #ff0033;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
    }
    .header p {
      color: #888;
      margin: 0;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: #141720;
      border: 1px solid #232733;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #383e50;
    }
    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .play-icon {
      background: #ff0000;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      padding-left: 3px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
    }
    .card-content {
      padding: 18px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card-content h2 {
      font-size: 18px;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .card-content .meta {
      color: #888;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .yt-btn {
      display: block;
      background: #ff0000;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 0;
      border-radius: 25px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .yt-btn:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-back">&larr; Back to Home</a>

    <div class="header">
      <span class="badge">OFFICIAL RELEASES</span>
      <h1>Watch on YouTube</h1>
      <p>Stream official music videos and teasers by Remo Singh</p>
    </div>

    <div class="grid">

      <!-- Card: HOUPON -->
      <div class="card">
        <div class="thumb-wrap">
          <img src="https://img.youtube.com/vi/8tc0aTQ9UA0/hqdefault.jpg" alt="Houpon - Remo Singh">
          <a href="https://youtu.be/8tc0aTQ9UA0" class="play-overlay" onclick="openYouTubeApp(event, '8tc0aTQ9UA0')">
            <span class="play-icon">▶</span>
          </a>
        </div>
        <div class="card-content">
          <div>
            <h2>Houpon (Teaser)</h2>
            <div class="meta">Original Music • Remo Singh</div>
          </div>
          <a href="https://youtu.be/8tc0aTQ9UA0" class="yt-btn" onclick="openYouTubeApp(event, '8tc0aTQ9UA0')">
            Open in YouTube App
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    function openYouTubeApp(event, videoId) {
      const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
      if (isMobile) {
        event.preventDefault();
        window.location.href = "vnd.youtube:" + videoId;
        setTimeout(() => {
          window.location.href = "https://www.youtube.com/watch?v=" + videoId;
        }, 1000);
      }
    }
  </script>

</body>
</html>
