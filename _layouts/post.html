<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0f">

  <title>{{ page.title }} | Remo Singh</title>
  <meta name="title" content="{{ page.title }} | Remo Singh">
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="https://remosingh.in{{ page.url }}">

  <!-- Social & AI Open Graph Meta Tags -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://remosingh.in{{ page.url }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  {% if page.thumbnail %}
  <meta property="og:image" content="https://remosingh.in{{ page.thumbnail }}">
  {% else %}
  <meta property="og:image" content="https://remosingh.in/images/Remo%20singh.jpg">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="site-header">
    <a href="/index.html" class="brand-link">Remo Singh</a>
    <a href="/blog.html" style="color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600;">← All Blogs</a>
  </header>

  <main class="main-wrapper" style="max-width: 760px; margin: 0 auto; padding: 40px 18px 80px;">
    <article class="blog-article">
      {% if page.thumbnail %}
      <img src="{{ page.thumbnail }}" alt="{{ page.title }}" style="width: 100%; border-radius: 14px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.1);">
      {% endif %}

      <h1 style="color: #ffffff; font-size: 2.1rem; line-height: 1.25; margin-bottom: 10px;">{{ page.title }}</h1>
      <p style="color: rgba(255, 255, 255, 0.45); font-size: 0.88rem; margin-bottom: 28px;">
        Published on {{ page.date | date: "%B %d, %Y" }} • By Remo Singh
      </p>

      <div class="article-content" style="color: rgba(255, 255, 255, 0.88); font-size: 1.05rem; line-height: 1.85;">
        {{ content }}
      </div>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Remo Singh. All rights reserved.</p>
  </footer>

</body>
</html>
