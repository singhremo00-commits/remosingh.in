---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0f">

  <title>Blog | Remo Singh Official</title>
  <meta name="title" content="Blog | Remo Singh Official">
  <meta name="description" content="Official stories and music updates from independent artist Remo Singh.">
  <link rel="canonical" href="https://remosingh.in/blog.html">

  <!-- Favicon Links -->
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://remosingh.in/blog.html">
  <meta property="og:title" content="Blog | Remo Singh">
  <meta property="og:image" content="https://remosingh.in/images/remo-singh-hero.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    .blog-page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 80px;
    }

    .blog-back-btn {
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 25px;
      transition: color 0.2s;
    }
    .blog-back-btn:hover {
      color: #38bdf8;
    }

    /* Auto Blog Grid */
    .blog-posts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }
    @media (min-width: 768px) {
      .blog-posts-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .post-card {
      background: #14171f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .post-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }
    .post-card-thumb {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #1e222d;
    }
    .post-card-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .post-card-date {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .post-card-title {
      font-size: 20px;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 18px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .post-card-readmore {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://remosingh.in/blog.html#collection",
    "url": "https://remosingh.in/blog.html",
    "name": "Blog by Remo Singh",
    "isPartOf": { "@id": "https://remosingh.in/#website" }
  }
  </script>
</head>

<body class="blog-listing-body">
  <div class="blog-page-container">
    <a href="/index.html" class="blog-back-btn">&larr; Back to Home</a>

    <div class="blog-posts-grid">
      {% for post in site.posts %}
      <a href="{{ post.url }}" class="post-card">
        {% if post.image %}
        <img src="{{ post.image }}" alt="{{ post.title }}" class="post-card-thumb" loading="lazy">
        {% endif %}
        <div class="post-card-content">
          <span class="post-card-date">{{ post.date | date: "%B %d, %Y &bull; %I:%M %p" }}</span>
          <h2 class="post-card-title">{{ post.title }}</h2>
          <span class="post-card-readmore">Read full story &rarr;</span>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
