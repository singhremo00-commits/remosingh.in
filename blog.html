<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0f">
  
  <title>Journal & Stories | Remo Singh Official</title>
  <meta name="description" content="Official stories, songwriting journals, and behind-the-scenes by independent artist Remo Singh.">
  <link rel="canonical" href="https://remosingh.in/blog.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://remosingh.in/blog.html">
  <meta property="og:title" content="Journal & Stories | Remo Singh Official">
  <meta property="og:description" content="Official stories, songwriting journals, and behind-the-scenes by Remo Singh.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="blog-page-body">

  <header class="blog-header">
    <a href="index.html" class="nav-brand">REMO SINGH</a>
    <a href="index.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </header>

  <section class="blog-hero">
    <span class="sub-badge">OFFICIAL JOURNAL</span>
    <h1>Stories, Music & Thoughts</h1>
    <p>Behind-the-scenes, acoustic songwriting diaries, and official updates.</p>
  </section>

  <main class="blog-container">
    <!-- Automated Post Cards Container -->
    <div class="posts-grid" id="posts-container">
      <!-- Loading state -->
      <p style="color: #9ca3af; text-align: center;">Loading stories...</p>
    </div>
  </main>

  <footer class="blog-footer">
    <div class="footer-socials">
      <a href="https://open.spotify.com/artist/57F1kF0dK6v70X7G0l1g2z" target="_blank" rel="noopener" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
      <a href="https://instagram.com/remosinghmusic" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://twitter.com/remosinghmusic" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <p>© 2026 Remo Singh. All rights reserved.</p>
  </footer>

  <!-- Automation Script -->
  <script>
    async function loadJournalPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch('posts.json?v=' + new Date().getTime());
        const posts = await response.json();

        if (!posts || posts.length === 0) {
          container.innerHTML = '<p style="color: #9ca3af; text-align: center;">No stories published yet.</p>';
          return;
        }

        container.innerHTML = posts.map(post => `
          <article class="post-card">
            <div class="post-meta">
              <span class="post-date"><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <span class="post-tag">${post.tag}</span>
            </div>
            <h2><a href="${post.link}">${post.title}</a></h2>
            <p>${post.summary}</p>
            <a href="${post.link}" class="read-more-link">Read Story <i class="fa-solid fa-arrow-right"></i></a>
          </article>
        `).join('');
      } catch (err) {
        console.error('Error loading posts:', err);
        container.innerHTML = '<p style="color: #ef4444; text-align: center;">Failed to load stories.</p>';
      }
    }
    loadJournalPosts();
  </script>
</body>
</html>
