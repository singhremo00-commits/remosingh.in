<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remo Singh Content Manager</title>
</head>
<body>
  <!-- Decap CMS with Manual Init -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    let token = localStorage.getItem('gh_decap_token');
    if (!token) {
      token = prompt("Enter your GitHub Personal Access Token (ghp_...):");
      if (token) {
        localStorage.setItem('gh_decap_token', token.trim());
      }
    }

    if (token) {
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'singhremo00-commits/remosingh.in',
            branch: 'main',
            token: token.trim()
          },
          load_config_file: false,
          media_folder: 'images/uploads',
          public_folder: '/images/uploads',
          collections: [
            {
              name: 'blog',
              label: 'Blog Posts',
              folder: '_posts',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              fields: [
                { label: 'Layout', name: 'layout', widget: 'hidden', default: 'post' },
                { label: 'Post Title', name: 'title', widget: 'string' },
                { label: 'Publish Date', name: 'date', widget: 'datetime' },
                { label: 'Short Description', name: 'description', widget: 'string' },
                { label: 'Featured Image', name: 'thumbnail', widget: 'image', required: false },
                { label: 'Article Body', name: 'body', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    }
  </script>
</body>
</html>
