  <main class="main-wrapper">
    <div class="page-header">
      <h1 class="page-title">Contact</h1>
      <p class="page-subtitle">For music enquiries, performances, and collaborations.</p>
    </div>

    <div class="contact-container">
      <!-- Direct Email Enquiry Box -->
      <section class="direct-enquiry-box" aria-label="Business & Music Enquiries">
        <p class="direct-enquiry-label">Business &amp; Music Enquiries</p>
        <!-- Replace contact@remosingh.in with your actual official email address -->
        <a href="mailto:contact@remosingh.in" class="direct-enquiry-link">contact@remosingh.in</a>
      </section>

      <!-- Contact Form Placeholder -->
      <!-- Replace the action attribute with your Formspree endpoint (e.g. action="https://formspree.io/f/your_form_id") -->
      <form class="contact-form" action="#" method="POST" aria-label="Contact Remo Singh">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="Your Name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="your.email@example.com">
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" class="form-control" required placeholder="Enquiry / Collaboration Subject">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" class="form-control" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
